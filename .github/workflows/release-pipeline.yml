name: run tests and release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  # --- Job 1: Run tests ---
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # # Set up .NET
      # - name: Set up .NET
      #   uses: actions/setup-dotnet@v5
      #   with:
      #     dotnet-version: 10.x.x

      # # Restore .NET tools
      # - name: Restore .NET dependencies
      #   run: dotnet tool restore

      # # Install Node.js
      # - name: Set up Node.js
      #   uses: actions/setup-node@v6
      #   with:
      #     node-version: 22
      #     cache: "npm"

      # Trusted publishing with npm requires at least npm version 11.5.1, BUT node v22 comes with npm v10.x.
      # https://docs.npmjs.com/trusted-publishers
      # - name: Update npm version to at least 11.5.1
      #   run: npm install -g npm@11.5.1

      # # Install npm dependencies
      # - name: Install root npm dependencies
      #   run: npm i

      # # Install playwright dependencies
      # - name: Install Playwright dependencies
      #   working-directory: src/Components
      #   run: npx playwright install --with-deps chromium

      # - name: Run Tests
      #   run: dotnet run --project ./build/Build.fsproj -- test

  # --- Job 2: Detect new version ---
  verify_release:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      should_skip: ${{ steps.buildscript.outputs.should_skip }}
      version: ${{ steps.buildscript.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # actions/checkout@v4 uses shallow clones by default, so we need to fetch all tags
      - name: Fetch all git tags
        run: git fetch --tags --force

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x.x'

      - id: buildscript
        name: Check for new version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project ./build/Build.fsproj -- prerelease

  release:
    needs: verify_release
    if: ${{ needs.verify_release.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    # The npm and NuGet trusted publishing policies still name the old Swate repo. Until they are
    # updated, a failed npm or NuGet publish must not stop the GitHub release.
    continue-on-error: ${{ matrix.target == 'nuget' || matrix.target == 'npm' }}
    strategy:
      fail-fast: false
      matrix:
        target: [nuget, npm, docker, electron-web, storybook]
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Set up .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x.x

      # Restore .NET tools
      - name: Restore .NET dependencies
        run: dotnet tool restore

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      # Trusted publishing with npm requires at least npm version 11.5.1, BUT node v22 comes with npm v10.x.
      # https://docs.npmjs.com/trusted-publishers
      - name: Update npm version to at least 11.5.1
        run: npm install -g npm@11.5.1

      # Install npm dependencies
      - name: Install root dependencies
        run: npm i

      # Get a short-lived NuGet API key
      # https://learn.microsoft.com/en-gb/nuget/nuget-org/trusted-publishing#github-actions-setup
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        if: ${{ matrix.target == 'nuget' }}
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      - name: Run release for ${{ matrix.target }}
        env:
          NUGET_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
          DOCKER_KEY: ${{ secrets.GITHUB_TOKEN }} # or your docker/personal token
        run: dotnet run --project ./build/Build.fsproj -- release ${{ matrix.target }} --ci --user=${{ github.actor }}

      # Release.verifyReleaseAssets in build/Actions/Release.fs expects this artifact.
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.target == 'electron-web' }}
        with:
          name: release-assets-client
          path: SwateClient.zip

      # This publishes storybook folder to gh-pages. Only run on matrix.target == 'storybook'
      - name: Publish Storybook to GitHub Pages
        uses: bitovi/github-actions-storybook-to-github-pages@v1.0.3
        if: ${{ matrix.target == 'storybook' }}
        with:
          install_command: echo "install skipped"  # default: npm ci
          build_command: echo "build skipped" # default: npm run build-storybook
          path: src/Components/storybook-static # default: dist/storybook
          checkout: false # default: true

  release_electron_binaries:
    needs: verify_release
    if: ${{ needs.verify_release.outputs.should_skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Release.verifyReleaseAssets and Release.electronTarget in build/Actions/Release.fs list
        # every entry here. Update them when this matrix changes.
        include:
          - os: windows-latest
            arch: x64

          # - os: windows-latest
          #   arch: arm64

          - os: macos-latest
            arch: x64

          - os: macos-latest
            arch: arm64

          - os: ubuntu-latest
            arch: x64

          - os: ubuntu-latest
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Set up .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x.x

      # Restore .NET tools
      - name: Restore .NET dependencies
        run: dotnet tool restore

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Trusted publishing with npm requires at least npm version 11.5.1, BUT node v22 comes with npm v10.x.
      # https://docs.npmjs.com/trusted-publishers
      - name: Update npm version to at least 11.5.1
        run: npm install -g npm@11.5.1

      # Install npm dependencies
      - name: Install root dependencies
        run: npm i

      - name: Install AppImage build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Build Electron binaries
        env:
          # The macOS runners have 7 GB of RAM, so Node picks a smaller default heap there than on
          # the 16 GB Linux and Windows runners, and the 2.6.0 build ran out of memory (#1421).
          # 4096 is the limit Node already uses on the 16 GB runners, so only the macOS jobs change.
          NODE_OPTIONS: --max-old-space-size=4096
        run: dotnet run --project ./build/Build.fsproj -- release electron-bin --ci --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-electron-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src/Electron/out/make/**/*.exe
            src/Electron/out/make/**/*.nupkg
            src/Electron/out/make/**/*.zip
            src/Electron/out/make/**/*.dmg
            src/Electron/out/make/**/*.deb
            src/Electron/out/make/**/*.rpm
            src/Electron/out/make/**/*.AppImage
            src/Electron/out/make/**/*.pkg.tar.zst

  post_release:
    needs: [release, release_electron_binaries, verify_release]
    runs-on: ubuntu-latest
    if: ${{ needs.verify_release.outputs.should_skip != 'true' }}

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Set up .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x.x

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets

      - name: Upload assets and finalize release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project ./build/Build.fsproj -- postrelease release-assets
